<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="app.css">

</head>

<body class="login-page">

    <div class="login-container">

        <h1>Login</h1>


        <!-- Login Form -->

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>


        <button
            type="button"
            id="forgotPasswordButton"
        >
            Forgot Password?
        </button>

        <p id="forgotMessage"></p>


        <!-- Login Message -->

        <p id="message"></p>


        <!-- Signup Section -->

        <div class="signup-section">

            <p>New user?</p>

            <button
                id="signupButton"
                type="button"
            >
                Sign Up
            </button>

        </div>

    </div>


    <!-- Axios -->

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Our JavaScript -->

    <script src="script.js"></script>

</body>

</html>
